mode: deployment

namespaceOverride: observability

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  tag: 0.152.0

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /stats/prometheus
  prometheus.istio.io/secure-port: "15091"
  sidecar.istio.io/userVolumeMount: |
    [{"name":"istio-certs","mountPath":"/etc/istio-certs","readOnly":true}]
  proxy.istio.io/config: |
    proxyMetadata:
      OUTPUT_CERTS: /etc/istio-certs

extraVolumes:
  - name: istio-certs
    emptyDir:
      medium: Memory

extraVolumeMounts:
  - name: istio-certs
    mountPath: /etc/istio-certs
    readOnly: true

clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources:
        - endpoints
        - pods
        - services
      verbs: ["get", "list", "watch"]

service:
  enabled: true

config:
  receivers:
    prometheus:
      config:
        scrape_configs:
          - job_name: avalanche
            scrape_interval: 15s
            kubernetes_sd_configs:
              - role: endpoints
                namespaces:
                  names:
                    - observability
            relabel_configs:
              - source_labels: [__meta_kubernetes_service_name]
                action: keep
                regex: avalanche
              - source_labels: [__meta_kubernetes_endpoint_port_name]
                action: keep
                regex: metrics
          - job_name: prometheus
            scrape_interval: 15s
            static_configs:
              - targets:
                  - prometheus.observability.svc.cluster.local:9090
          - job_name: istio-secure-merged-metrics
            scrape_interval: 15s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - observability
                    - istio-system
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_annotation_prometheus_istio_io_secure_port]
                action: keep
                regex: .+
              - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                action: keep
                regex: "true"
              - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                action: replace
                target_label: __metrics_path__
                regex: (.+)
              - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_istio_io_secure_port]
                action: replace
                target_label: __address__
                regex: (.+);(.+)
                replacement: $1:$2
              - source_labels: [__meta_kubernetes_namespace]
                action: replace
                target_label: kubernetes_namespace
              - source_labels: [__meta_kubernetes_pod_name]
                action: replace
                target_label: kubernetes_pod_name
            scheme: https
            tls_config:
              ca_file: /etc/istio-certs/root-cert.pem
              cert_file: /etc/istio-certs/cert-chain.pem
              key_file: /etc/istio-certs/key.pem
              insecure_skip_verify: true
          - job_name: otel-collector
            scrape_interval: 15s
            static_configs:
              - targets:
                  - otel-opentelemetry-collector.observability.svc.cluster.local:8888

  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 90
      spike_limit_percentage: 85
    batch:
      timeout: 1s
      send_batch_size: 1024

  exporters:
    prometheusremotewrite:
      endpoint: http://prometheus.observability.svc.cluster.local:9090/api/v1/write
    debug:
      verbosity: basic

  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  service:
    extensions: [health_check]
    pipelines:
      metrics:
        receivers: [prometheus]
        processors: [memory_limiter, batch]
        exporters: [prometheusremotewrite, debug]

resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: "250m"
    memory: 512Mi
